<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة الحركة — علوم الصف الرابع الابتدائي</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f2ea;--card:#ffffff;--ink:#1f2d3a;--mut:#64707c;--pri:#0f766e;--pri2:#0b5a54;--acc:#e8743b;--line:#e4ddcf;--soft:#e3f2ef;--red:#e5484d;--blue:#3b6fd4;--green:#16a34a;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',Tahoma,Arial,sans-serif;line-height:1.9;font-size:17px}
header.top{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;color:var(--pri);cursor:pointer;border:0;background:none;font-family:inherit}
.brand img{width:40px;height:40px;object-fit:contain}
.menu{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.menu button{font:inherit;font-weight:600;border:1px solid transparent;background:none;color:var(--ink);padding:6px 14px;border-radius:10px;cursor:pointer}
.menu button:hover{background:var(--soft)}
.menu button.on{background:var(--pri);color:#fff}
.lang{border:1px solid var(--pri)!important;color:var(--pri)!important;font-weight:700!important}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
main{padding:28px 0 80px}
.view{display:none;animation:fade .35s}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1{font-size:36px;line-height:1.35;margin:6px 0 10px}
h2{font-size:26px;color:var(--pri);margin:22px 0 10px}
h3{font-size:19px;margin:18px 0 6px}
p{margin:8px 0}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:40px 34px}
.kick{color:var(--acc);font-weight:700}
.lead{font-size:19px;color:var(--mut)}
.art{background:linear-gradient(150deg,var(--soft),#fbe3d3);border-radius:20px;padding:30px;text-align:center}
.art img{width:150px;height:150px;object-fit:contain;background:#fff;border-radius:20px;padding:10px}
.cta{display:inline-block;background:var(--pri);color:#fff;border:0;font:inherit;font-weight:700;padding:12px 24px;border-radius:14px;cursor:pointer;margin:8px 8px 0 0}
.cta.alt{background:transparent;color:var(--pri);border:2px solid var(--pri)}
.cta:hover{background:var(--pri2)}
.cta.alt:hover{background:var(--soft)}
.cta:disabled{opacity:.45;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.card .ico{font-size:34px}
.card p{color:var(--mut);margin:0;font-size:15px}
.unit{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px}
.tag{display:inline-block;background:var(--soft);color:var(--pri);padding:2px 12px;border-radius:99px;font-size:14px;font-weight:700}
.lessons{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:14px}
.lesson-link{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer;text-align:start;font-weight:600}
.lesson-link:hover{border-color:var(--pri)}
.lesson-link small{display:block;color:var(--mut);font-weight:400;font-size:14px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;margin-bottom:18px}
.crumb{font-size:14px;color:var(--mut);cursor:pointer;background:none;border:0;font-family:inherit;padding:0}
.crumb:hover{color:var(--pri)}
.rule{background:var(--soft);border-inline-start:5px solid var(--pri);border-radius:12px;padding:12px 16px;margin:12px 0}
.rule.o{background:#fdeee3;border-color:var(--acc)}
.rule b{color:var(--pri2)}
.rule.o b{color:#a4511c}
table{width:100%;border-collapse:collapse;font-size:15px;display:block;overflow-x:auto;margin:10px 0}
th,td{border:1px solid var(--line);padding:9px 12px;text-align:start}
th{background:var(--pri);color:#fff}
.sim{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin:14px 0}
.sim .hd{background:var(--pri);color:#fff;padding:8px 14px;font-weight:700;font-size:15px}
.sim canvas{display:block;width:100%;height:auto;background:#f9f7f1}
.sim .bd{padding:12px 14px;text-align:center}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:7px 16px;cursor:pointer;background:var(--acc);color:#fff}
.btn.g{background:var(--pri)}.btn.b{background:var(--blue)}.btn.r{background:var(--red)}
.btn.ghost{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.btn:disabled{opacity:.45;cursor:default}
.out{font-weight:800;color:var(--pri2);font-size:18px;margin:8px 0 0}
.row2{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center;margin:8px 0}
.row2 label{font-size:15px}
input[type=range]{width:min(360px,80%)}
input[type=number]{width:90px;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.ev{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.ev button{font:inherit;text-align:center;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;cursor:pointer;color:var(--ink)}
.ev button .e{font-size:30px;display:block}
.ev button.on{border-color:var(--acc);background:#fdeee3}
.chat{display:flex;flex-direction:column;gap:10px;padding:6px 0;min-height:60px}
.msg{max-width:80%;padding:9px 14px;border-radius:16px;font-size:16px;animation:fade .3s}
.msg b{display:block;font-size:13px;opacity:.8}
.msg.t{align-self:flex-start;background:var(--pri);color:#fff}
.msg.s{align-self:flex-end;background:var(--bg);border:1px solid var(--line)}
.q{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0;background:#fff}
.q p{margin:0 0 6px;font-weight:700}
.op{display:block;width:100%;text-align:start;font:inherit;font-size:16px;padding:7px 12px;margin:5px 0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;cursor:pointer}
.op:hover{border-color:var(--pri)}
.op.ok{background:var(--green);color:#fff;border-color:var(--green)}
.op.no{background:var(--red);color:#fff;border-color:var(--red)}
.pre{border:2px dashed var(--acc);background:#fffaf5}
.score{font-size:24px;font-weight:800;color:var(--pri);text-align:center;margin:16px 0}
.team{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.person{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;text-align:center}
.av{width:76px;height:76px;margin:0 auto 10px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--acc));color:#fff;font-size:28px;font-weight:800;display:grid;place-items:center}
.person small{color:var(--mut)}
.objectives{border-inline-start:5px solid var(--acc);background:var(--soft)}.objectives h3{margin:0 0 6px}.objectives ul{margin:8px 0 0;padding-inline-start:22px;line-height:1.9}
.brand img+img{margin-inline-start:2px}
.logos{display:flex;gap:18px;justify-content:center;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}
.logos img{width:110px;height:110px;object-fit:contain}
footer{border-top:1px solid var(--line);text-align:center;color:var(--mut);font-size:14px;padding:22px 0 30px;background:var(--card)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.hidden{display:none!important}
@media (max-width:760px){
  h1{font-size:28px}
  .hero{grid-template-columns:1fr;padding:24px 20px}
  .art{order:-1}
  .menu button{padding:5px 10px;font-size:15px}
  .msg{max-width:92%}
}
</style>
</head>

  <div class="sec objectives"><h3 data-ar="🎯 أهداف الدرس" data-en="🎯 Lesson objectives"></h3><p data-ar="بنهاية هذا الدرس سأكون قادرًا على:" data-en="By the end of this lesson I will be able to:"></p><ul><li data-ar="أن أُعرّف الحركة وأذكر أمثلة عليها من حياتي اليومية." data-en="Define motion and give everyday examples."></li><li data-ar="أن أُميّز بين قوة الدفع وقوة السحب." data-en="Distinguish between a push and a pull."></li><li data-ar="أن أُفسّر متى تكون القوى متزنة ومتى تكون غير متزنة." data-en="Explain when forces are balanced or unbalanced."></li><li data-ar="أن أتوقع أثر القوى على حركة الأجسام." data-en="Predict how forces affect the motion of objects."></li></ul></div>
  <div class="sec pre" data-pre="pre1"></div>
  <div class="lessonBody hidden" data-body="l1">
    <div class="sec">
      <h2 data-ar="ما هي الحركة؟" data-en="What is motion?"></h2>
      <p data-ar="الحركة هي <b>أي تغيير في وضع الجسم</b>، يعني انتقاله من مكان لآخر. ولبدء الحركة أو إيقافها لازم تكون فيه <b>قوة</b>." data-en="Motion is <b>any change in an object's position</b>, meaning it moves from one place to another. To start or stop motion, you need a <b>force</b>."></p>
      <table>
        <tr><th data-ar="قوة الدفع" data-en="Push"></th><th data-ar="قوة السحب" data-en="Pull"></th></tr>
        <tr><td data-ar="تبعد الأشياء عنا، مثل دفع عربة في محل أو ركل الكورة" data-en="Pushes things away from us, like pushing a shopping cart or kicking a ball"></td><td data-ar="تقرّب الأشياء منا، مثل سحب الباب أو سحب الحبل" data-en="Brings things closer to us, like pulling a door or a rope"></td></tr>
      </table>
      <p data-ar="الجسم اللي بيقف على الأرض مش بيتحرك لوحده. لما تدفعه بقوة، بيبدأ يتحرك، ولما تسيب الدفع الاحتكاك بيوقفه تدريجيًا." data-en="An object standing on the ground does not move by itself. When you push it, it starts moving; when you stop pushing, friction slowly stops it."></p>
      <h3 data-ar="🎯 جرّب بنفسك" data-en="🎯 Try it yourself"></h3>
      <div class="sim">
        <div class="hd" data-ar="الصندوق والقوة" data-en="The box and the force"></div>
        <canvas id="mv" width="800" height="240"></canvas>
        <div class="bd">
          <div class="btns">
            <button class="btn g" onclick="pushBox(1)" data-ar="⟶ ادفع" data-en="⟶ Push"></button>
            <button class="btn b" onclick="pushBox(-1)" data-ar="⟵ اسحب" data-en="⟵ Pull"></button>
            <button class="btn ghost" onclick="balanceBox()" data-ar="⇄ قوتان متساويتان" data-en="⇄ Equal forces"></button>
          </div>
          <p class="out" id="mvOut"></p>
        </div>
      </div>
    </div>

    <div class="sec">
      <h2 data-ar="القوى المتزنة وغير المتزنة" data-en="Balanced and unbalanced forces"></h2>
      <div class="rule"><b data-ar="متزنة:" data-en="Balanced:"></b> <span data-ar="لا تغيّر حالة الجسم، فيفضل ساكنًا أو متحركًا بسرعة ثابتة." data-en="They do not change the object's state; it stays still or keeps a constant speed."></span><br><b data-ar="غير متزنة:" data-en="Unbalanced:"></b> <span data-ar="تغيّر حالة الجسم وتسبب حركته." data-en="They change the object's state and make it move."></span></div>
      <div class="sim">
        <div class="hd" data-ar="شد الحبل" data-en="Tug of war"></div>
        <canvas id="tw" width="800" height="200"></canvas>
        <div class="bd">
          <div class="row2">
            <label><span data-ar="الفريق الأيسر:" data-en="Left team:"></span> <b id="lv">5</b> <input type="range" min="1" max="10" value="5" id="lf"></label>
            <label><span data-ar="الفريق الأيمن:" data-en="Right team:"></span> <b id="rv">5</b> <input type="range" min="1" max="10" value="5" id="rf"></label>
          </div>
          <p class="out" id="twOut"></p>
        </div>
      </div>
      <div class="rule o"><b data-ar="الخلاصة:" data-en="Summary:"></b> <span data-ar="القوى المتزنة لا تسبب حركة الجسم، والقوى غير المتزنة هي اللي بتحركه." data-en="Balanced forces do not make an object move; unbalanced forces are what move it."></span></div>
    </div>

    <div class="sec">
      <h2 data-ar="🗣️ حوار في الفصل" data-en="🗣️ Classroom dialogue"></h2>
      <p data-ar="اضغط 'التالي' وتابع النقاش بين الأستاذ وتلميذين:" data-en="Press 'Next' to follow the discussion between the teacher and two students:"></p>
      <div class="chat" id="chat"></div>
      <div class="btns"><button class="btn g" id="nextMsg" data-ar="التالي ←" data-en="Next →"></button><button class="btn ghost" onclick="startChat()" data-ar="↺ أعد الحوار" data-en="↺ Restart"></button></div>
    </div>
    <div class="pager"><button class="cta alt" data-go="units" data-ar="← الوحدات" data-en="← Units"></button><button class="cta" data-go="l2" data-ar="الدرس التالي 🚀" data-en="Next lesson 🚀"></button></div>
  </div>
</section>

<section class="view" id="v-l2">
  <button class="crumb" data-go="units" data-ar="← العودة للوحدات" data-en="← Back to units"></button>
  <h1 data-ar="الدرس الثاني: الطاقة وتحولاتها" data-en="Lesson 2: Energy and its changes"></h1>
  <div class="sec objectives"><h3 data-ar="🎯 أهداف الدرس" data-en="🎯 Lesson objectives"></h3><p data-ar="بنهاية هذا الدرس سأكون قادرًا على:" data-en="By the end of this lesson I will be able to:"></p><ul><li data-ar="أن أذكر صور الطاقة المختلفة." data-en="List the different forms of energy."></li><li data-ar="أن أوضح مفهوم الشغل وعلاقته بالطاقة." data-en="Explain work and its relation to energy."></li><li data-ar="أن أُفسّر تحوّل طاقة الوضع إلى طاقة حركة." data-en="Explain how potential energy turns into kinetic energy."></li><li data-ar="أن أستنتج أن الطاقة لا تفنى ولا تُستحدث وإنما تتحول من صورة لأخرى." data-en="Conclude that energy is conserved and only changes form."></li></ul></div>
  <div class="sec pre" data-pre="pre2"></div>
  <div class="lessonBody hidden" data-body="l2">
    <div class="sec">
      <h2 data-ar="الطاقة والشغل" data-en="Energy and work"></h2>
      <div class="rule"><b data-ar="الطاقة:" data-en="Energy:"></b> <span data-ar="هي القدرة على بذل شغل." data-en="The ability to do work."></span> <b data-ar="الشغل:" data-en="Work:"></b> <span data-ar="هو القوة اللي بتسبب حركة الجسم." data-en="The force that makes an object move."></span></div>
      <p data-ar="كل حاجة حوالينا فيها طاقة، والطاقة مش بتتخلق من العدم ولا بتختفي. اللي بيحصل إنها بتتحول من صورة لصورة، زي ما بتحصل لما بتاكل: الأكل فيه طاقة كيميائية، وجسمك بيحولها لحركة وحرارة." data-en="Everything around us has energy. Energy is never created from nothing or destroyed; it changes from one form to another, like when you eat: food contains chemical energy, and your body turns it into movement and heat."></p>
      <h3 data-ar="اختار صورة من صور الطاقة" data-en="Pick a form of energy"></h3>
      <div class="ev" id="enCards"></div>
      <div class="rule o" id="enOut"></div>
    </div>

    <div class="sec">
      <h2 data-ar="🎢 الطاقة وهي بتتحول على المنحدر" data-en="🎢 Energy changing on a slope"></h2>
      <p data-ar="حرّك العربة وشوف طاقة الوضع بتتحول لطاقة حركة. كل ما العربة تنزل، طاقة الوضع تقل وطاقة الحركة تزيد." data-en="Move the cart and watch potential energy turn into kinetic energy. As the cart goes down, potential energy drops and kinetic energy rises."></p>
      <div class="sim">
        <div class="hd" data-ar="منحدر تفاعلي" data-en="Interactive slope"></div>
        <canvas id="cs" width="800" height="260"></canvas>
        <div class="bd"><input type="range" min="0" max="100" value="0" id="cp" aria-label="موضع العربة"></div>
      </div>
      <div class="rule"><b data-ar="قانون بقاء الطاقة:" data-en="Conservation of energy:"></b> <span data-ar="الطاقة لا تفنى ولا تستحدث، لكن بنقدر نحولها من صورة لصورة." data-en="Energy cannot be created or destroyed, only changed from one form to another."></span></div>
    </div>

  </div>
</section>

  <h1 data-ar="الدرس الثالث: السرعة" data-en="Lesson 3: Speed"></h1>
  <div class="sec objectives"><h3 data-ar="🎯 أهداف الدرس" data-en="🎯 Lesson objectives"></h3><p data-ar="بنهاية هذا الدرس سأكون قادرًا على:" data-en="By the end of this lesson I will be able to:"></p><ul><li data-ar="أن أُعرّف السرعة." data-en="Define speed."></li><li data-ar="أن أحسب السرعة باستخدام القانون: السرعة = المسافة ÷ الزمن." data-en="Calculate speed using: speed = distance ÷ time."></li><li data-ar="أن أستخدم وحدات السرعة المناسبة (م/ث، كم/س)." data-en="Use the proper units of speed (m/s, km/h)."></li><li data-ar="أن أقارن بين سرعات أجسام مختلفة وأُحدد الأسرع." data-en="Compare the speeds of different objects and find the fastest."></li></ul></div>
  <div class="sec pre" data-pre="pre3"></div>
  <div class="lessonBody hidden" data-body="l3">
    <div class="sec">
      <h2 data-ar="تعريف السرعة" data-en="Defining speed"></h2>
      <div class="rule"><b data-ar="السرعة = المسافة ÷ الزمن" data-en="Speed = distance ÷ time"></b><br><span data-ar="وحداتها: متر لكل ثانية (م/ث) أو كيلومتر لكل ساعة (كم/س)." data-en="Units: metres per second (m/s) or kilometres per hour (km/h)."></span></div>
      <p data-ar="السرعة بتقولك الجسم بيقطع مسافة قد إيه في الثانية الواحدة. مثال: لو العداء قطع 100 متر في 10 ثواني، سرعته 10 م/ث. ولو قطع نفس المسافة في 20 ثانية، سرعته أقل، يعني 5 م/ث." data-en="Speed tells you how much distance an object covers per unit of time. Example: if a runner covers 100 m in 10 s, their speed is 10 m/s. If they cover the same distance in 20 s, their speed is lower: 5 m/s."></p>
      <h3 data-ar="🏁 سباق السيارات" data-en="🏁 Car race"></h3>
      <p data-ar="الصفراء قطعت 10 متر في 5 ثواني، والخضراء قطعت 20 متر في نفس الزمن. مين أسرع؟ شغّل السباق وشوف:" data-en="The yellow car covered 10 m in 5 s, and the green car covered 20 m in the same time. Which is faster? Start the race and see:"></p>
      <div class="sim">
        <div class="hd" data-ar="الصفراء ضد الخضراء" data-en="Yellow vs Green"></div>
        <canvas id="rc" width="800" height="180"></canvas>
        <div class="bd">
          <div class="btns"><button class="btn g" onclick="race()" data-ar="▶ ابدأ السباق" data-en="▶ Start race"></button></div>
          <p class="out" id="raceOut"></p>
        </div>
      </div>
    </div>
    <div class="sec">
      <h2 data-ar="🧮 احسب السرعة بنفسك" data-en="🧮 Calculate speed yourself"></h2>
      <div class="row2">
        <label><span data-ar="المسافة (م):" data-en="Distance (m):"></span> <input type="number" id="dd" value="20" min="0"></label>
        <label><span data-ar="الزمن (ث):" data-en="Time (s):"></span> <input type="number" id="tt" value="5" min="1"></label>
        <button class="btn g" onclick="calc()" data-ar="احسب" data-en="Calculate"></button>
      </div>
      <p class="out" id="calcOut"></p>
    </div>

  </div>
</section>

  <h1 data-ar="الدرس الرابع: الطاقة والتصادم" data-en="Lesson 4: Energy and collisions"></h1>
  <div class="sec objectives"><h3 data-ar="🎯 أهداف الدرس" data-en="🎯 Lesson objectives"></h3><p data-ar="بنهاية هذا الدرس سأكون قادرًا على:" data-en="By the end of this lesson I will be able to:"></p><ul><li data-ar="أن أُوضّح ما يحدث للطاقة عند التصادم." data-en="Describe what happens to energy in a collision."></li><li data-ar="أن أربط بين سرعة الجسم وحجم الضرر الناتج عن التصادم." data-en="Relate an object's speed to the damage in a collision."></li><li data-ar="أن أشرح دور حزام الأمان والوسادة الهوائية في الحماية." data-en="Explain how seat belts and airbags protect us."></li><li data-ar="أن أتبع قواعد السلامة المرورية." data-en="Follow road-safety rules."></li></ul></div>
  <div class="sec pre" data-pre="pre4"></div>
  <div class="lessonBody hidden" data-body="l4">
    <div class="sec">
      <h2 data-ar="💥 جرّب التصادم بسرعات مختلفة" data-en="💥 Try collisions at different speeds"></h2>
      <p data-ar="عند التصادم، الطاقة اللي كانت في حركة الجسم بتنتقل للحاجة اللي اتصدمت فيها، وجزء منها بيتحول لصوت أو حرارة. كل ما السرعة تزيد، الطاقة اللي بتنتقل بتزيد والضرر يزيد." data-en="During a collision, the energy in the moving object transfers to what it hits, and some of it turns into sound or heat. The higher the speed, the more energy is transferred and the greater the damage."></p>
      <div class="sim">
        <div class="hd" data-ar="عربية وحيطة" data-en="Car and wall"></div>
        <canvas id="cr" width="800" height="200"></canvas>
        <div class="bd">
          <div class="row2">
            <label><span data-ar="السرعة (كم/س):" data-en="Speed (km/h):"></span> <b id="sv">40</b> <input type="range" min="10" max="120" value="40" id="sp"></label>
            <button class="btn r" onclick="crash()" data-ar="💥 اصطدم" data-en="💥 Crash"></button>
          </div>
          <p style="margin:6px 0;font-size:15px" data-ar="مستوى الضرر" data-en="Damage level"></p>
          <div style="height:18px;border-radius:10px;background:var(--line);max-width:420px;margin:0 auto;overflow:hidden"><div id="dmg" style="height:100%;width:0;background:var(--red);transition:width .6s"></div></div>
          <p class="out" id="crOut"></p>
        </div>
      </div>
    </div>
    <div class="rule o"><b data-ar="ليه العربيات فيها وسادة هوائية وحزام أمان؟" data-en="Why do cars have airbags and seat belts?"></b> <span data-ar="الوسادة بتتفتح وتمتص جزء من الطاقة، والحزام بيمنع جسمك إنه يكمل حركته لقدام، فيقل الضرر." data-en="The airbag opens and absorbs part of the energy, and the belt stops your body from continuing forward, which reduces injury."></span></div>

/* حالة الاختبارات: إجابات المستخدم محفوظة عشان تفضل بعد تغيير اللغة */
const state={};
function renderQuizBox(container,key,items,onDone){
  const box=document.getElementById(container);
  if(!state[key])state[key]=items.map(()=>null);
  box.innerHTML='';
  const s=state[key];
  items.forEach((it,i)=>{
    const w=document.createElement('div');w.className='q';
    w.innerHTML='<p>'+(i+1)+'. '+it.q[LANG==='ar'?0:1]+'</p>';
    it.o.forEach((o,j)=>{
      const b=document.createElement('button');b.className='op';b.textContent=o[LANG==='ar'?0:1];
      if(s[i]!==null){
        if(j===it.a)b.classList.add('ok');
        else if(j===s[i])b.classList.add('no');
        b.disabled=true;
      }
      b.onclick=()=>{if(s[i]!==null)return;s[i]=j;renderQuizBox(container,key,items,onDone)};
      w.appendChild(b);
    });
    box.appendChild(w);
  });
  const done=s.every(v=>v!==null);
  const correct=s.filter((v,i)=>v===items[i].a).length;
  if(onDone)onDone(done,correct,items.length);
}
function renderPre(key,id){
  const box=document.querySelector('[data-pre="'+key+'"]');
  const body=document.querySelector('[data-body="'+id+'"]');
  const items=PRE[key];
  box.innerHTML=(LANG==='ar'?'<h2>📝 اختبار قبلي</h2><p>جاوب الأسئلة دي قبل الدرس عشان تعرف تعرف إيه أصلًا.</p>':'<h2>📝 Pre-test</h2><p>Answer these before the lesson to see what you already know.</p>')+'<div id="'+key+'-box"></div><p class="score" id="'+key+'-sc"></p><div class="btns"><button class="btn g" id="'+key+'-go"></button></div>';
  renderQuizBox(key+'-box',key,items,(done,c,n)=>{
    const sc=document.getElementById(key+'-sc');
    const go=document.getElementById(key+'-go');
    sc.textContent=done?(LANG==='ar'?'نتيجتك القبلية: '+c+' من '+n:'Your pre-test score: '+c+' of '+n):'';
    go.disabled=!done;
    go.textContent=LANG==='ar'?'ابدأ الدرس ←':'Start the lesson →';

}
function go_(id){document.querySelector('[data-body="'+id+'"]').scrollIntoView({behavior:'smooth'})}

const mvC=document.getElementById('mv'),mvX=mvC.getContext('2d');
let mv={x:400,v:0,f:0,t:0,mode:'none'};
let mvKey=null;
function pushBox(d){mv.f=d*0.6;mv.t=1.2;mv.mode='move';mvKey=d>0?'push':'pull';refreshOutputs();}
function balanceBox(){mv.f=0;mv.t=0;mv.v=0;mv.mode='bal';mvKey='bal';refreshOutputs();}
function drawMv(dt){
  const W=mvC.width,H=mvC.height;
  mvX.clearRect(0,0,W,H);
  mv.t=Math.max(0,mv.t-dt);
  if(mv.t>0)mv.v+=mv.f*dt*60;
  mv.v*=0.94;mv.x+=mv.v*dt*60;
  mv.x=Math.max(140,Math.min(W-140,mv.x));
  mvX.fillStyle='#e4ddcf';mvX.fillRect(0,H-40,W,40);
  mvX.fillStyle='#c98b3f';mvX.fillRect(mv.x-60,H-140,120,100);
  mvX.fillStyle='#7a4d1f';mvX.fillRect(mv.x-60,H-140,120,8);
  if(mv.mode==='bal'){
    arrow(mvX,mv.x-160,H-90,mv.x-70,H-90,'#e5484d');
    arrow(mvX,mv.x+160,H-90,mv.x+70,H-90,'#3b6fd4');
  } else if(mv.t>0){
    const d=mv.f>0?1:-1;
    arrow(mvX,mv.x-d*150,H-90,mv.x-d*70,H-90,d>0?'#e5484d':'#3b6fd4');
  }
}
function arrow(ctx,x1,y1,x2,y2,col){
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  const a=Math.atan2(y2-y1,x2-x1);
  ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-16*Math.cos(a-.4),y2-16*Math.sin(a-.4));ctx.lineTo(x2-16*Math.cos(a+.4),y2-16*Math.sin(a+.4));ctx.fill();
}

const csC=document.getElementById('cs'),csX=csC.getContext('2d'),cp=document.getElementById('cp');
function drawCs(){
  const W=csC.width,H=csC.height,p=+cp.value/100;
  csX.clearRect(0,0,W,H);
  csX.strokeStyle='#0f766e';csX.lineWidth=7;csX.beginPath();
  for(let x=40;x<=W-40;x+=4){const y=H-40-((x-40)/(W-80))*(H-100);x===40?csX.moveTo(x,y):csX.lineTo(x,y)}
  csX.stroke();
  const xs=40+p*(W-80),ys=H-40-p*(H-100);
  csX.fillStyle='#e8743b';csX.beginPath();csX.arc(xs,ys-22,14,0,7);csX.fill();
  const pot=Math.round((1-p)*100),kin=100-pot;
  csX.fillStyle='#1f2d3a';csX.font='bold 17px Cairo';csX.textAlign=LANG==='ar'?'right':'left';
  const px=LANG==='ar'?W-20:20;
  csX.fillText(T('طاقة وضع: ','Potential: ')+pot,px,34);csX.fillText(T('طاقة حركة: ','Kinetic: ')+kin,px,62);
}

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;

  if(on('mv'))drawMv(dt);
  if(on('tw'))drawTw();
  if(on('cs'))drawCs();
  if(on('rc'))drawRace(dt);
  if(on('cr'))drawCrash();
  requestAnimationFrame(loop);
}
